[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "ssk"
version = "1.5.1"
description = "SolidSKeleton tessellation and format tools"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [
  { name = "Rogier Goossen" }
]
keywords = ["3d", "csg", "geometry", "solid modeling", "solidskeleton"]
dependencies = [
  "pyyaml>=6.0",
  "numpy>=1.24",
  "trimesh>=4.0",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

[project.urls]
Homepage = "https://github.com/FerroIT/SolidSKeleton"
Repository = "https://github.com/FerroIT/SolidSKeleton"
Issues = "https://github.com/FerroIT/SolidSKeleton/issues"
Specifications = "https://github.com/FerroIT/SolidSKeleton/tree/main/spec"

[project.scripts]
ssk = "ssklib.cli:main"

[tool.maturin]
manifest-path = "../../core/Cargo.toml"
module-name = "ssklib._core"
python-source = "."
features = ["python"]
include = ["ssklib/**/*.py", "ssk/**/*.py"]
