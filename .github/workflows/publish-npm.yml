name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: Test
    uses: ./.github/workflows/test.yml

  publish:
    name: Publish package
    runs-on: ubuntu-latest
    needs: test
    environment:
      name: npm
      url: https://www.npmjs.com/package/@ferroit/ssk
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: reference/typescript/package-lock.json

      - name: Install dependencies
        working-directory: reference/typescript
        run: npm ci

      - name: Publish to npm
        working-directory: reference/typescript
        run: npm publish --provenance --access public