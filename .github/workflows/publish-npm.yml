name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    uses: ./.github/workflows/test.yml

  publish:
    name: Publish package
    runs-on: ubuntu-latest
    needs: test
    environment:
      name: npm
      url: https://www.npmjs.com/package/@ferroit/ssk
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: reference/typescript/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install LLVM
        run: sudo apt-get update && sudo apt-get install -y clang-18 lld-18 libc++-18-dev libc++abi-18-dev

      - name: Install dependencies
        working-directory: reference/typescript
        run: npm ci

      - name: Build package
        working-directory: reference/typescript
        env:
          SSK_REBUILD_WASM: '1'
        run: npm run build

      - name: Check package contents
        working-directory: reference/typescript
        run: npm pack --dry-run --ignore-scripts

      - name: Publish to npm
        working-directory: reference/typescript
        run: npm publish --provenance --access public --ignore-scripts