name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: Test
    uses: ./.github/workflows/test.yml

  linux:
    name: Build Linux wheels (${{ matrix.target }})
    runs-on: ubuntu-24.04
    needs: test
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v5

      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
          working-directory: reference/python

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: reference/python/dist

  windows:
    name: Build Windows wheels (Python ${{ matrix.python }})
    runs-on: windows-latest
    needs: test
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist
          working-directory: reference/python

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.python }}
          path: reference/python/dist

  macos:
    name: Build macOS wheels (Python ${{ matrix.python }})
    runs-on: macos-15
    needs: test
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist --target universal2-apple-darwin
          working-directory: reference/python

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.python }}
          path: reference/python/dist

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [linux, windows, macos]
    environment:
      name: pypi
      url: https://pypi.org/project/ssk/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1