name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: Test
    uses: ./.github/workflows/test.yml

  linux:
    name: Build Linux wheels (${{ matrix.platform.name }})
    runs-on: ubuntu-24.04
    needs: test
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: x86_64
            target: x86_64
            manylinux: 2_28
          - name: aarch64
            target: aarch64
            manylinux: 2_28
    steps:
      - uses: actions/checkout@v5

      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --out dist --compatibility pypi
          working-directory: reference/python

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.platform.name }}
          path: reference/python/dist

  windows:
    name: Build Windows wheels (Python ${{ matrix.python }})
    runs-on: windows-latest
    needs: test
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist
          working-directory: reference/python

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.python }}
          path: reference/python/dist

  macos:
    name: Build macOS wheels (${{ matrix.platform.name }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.platform.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: x86_64
            os: macos-13
            target: x86_64-apple-darwin
          - name: arm64
            os: macos-15
            target: aarch64-apple-darwin
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --compatibility pypi
          working-directory: reference/python

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.platform.name }}-${{ matrix.python }}
          path: reference/python/dist

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [linux, windows, macos]
    environment:
      name: pypi
      url: https://pypi.org/project/ssk/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1