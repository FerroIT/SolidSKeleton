name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    uses: ./.github/workflows/test.yml

  linux:
    name: Linux ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            os: ubuntu-24.04
            target: x86_64
          - name: aarch64
            os: ubuntu-24.04-arm
            target: aarch64
    steps:
      - uses: actions/checkout@v5

      - uses: PyO3/maturin-action@v1
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
        with:
          target: ${{ matrix.target }}
          manylinux: '2_28'
          args: --release --out dist
          working-directory: implementation/packages/python

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.name }}
          path: implementation/packages/python/dist/*.whl

  windows:
    name: Windows x64
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: PyO3/maturin-action@v1
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
        with:
          args: --release --out dist
          working-directory: implementation/packages/python

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x64
          path: implementation/packages/python/dist/*.whl

  macos:
    name: macOS ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      CMAKE_OSX_DEPLOYMENT_TARGET: '11.0'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            os: macos-14
            target: x86_64-apple-darwin
          - name: arm64
            os: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          working-directory: implementation/packages/python

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.name }}
          path: implementation/packages/python/dist/*.whl

  sdist:
    name: Source distribution
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build sdist
        working-directory: implementation/packages/python
        run: |
          python -m pip install --upgrade pip maturin
          maturin sdist --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: implementation/packages/python/dist/*.tar.gz

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [linux, windows, macos, sdist]
    if: github.event_name == 'release'
    environment:
      name: pypi
      url: https://pypi.org/project/ssk/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          merge-multiple: true
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1