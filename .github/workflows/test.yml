name: Test

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin
          cd reference/python && maturin build --release --out dist
          pip install dist/*.whl

      - name: Run conformance tests
        run: |
          python -m unittest discover -s reference/python/tests -p test_conformance.py

      - name: Run format validation tests
        run: |
          python -m unittest discover -s reference/python/tests -p test_format_validation.py

      - name: Run example tests
        run: |
          python -m unittest discover -s reference/python/tests -p test_examples.py

      - name: Run example sweep tests
        run: |
          python -m unittest discover -s reference/python/tests -p test_example_sweep.py

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r reference/python/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: reference/typescript/package-lock.json

      - name: Install TypeScript dependencies
        working-directory: reference/typescript
        run: |
          npm ci

      - name: Run TypeScript typecheck
        working-directory: reference/typescript
        run: npm run typecheck

      - name: Run TypeScript format tests
        working-directory: reference/typescript
        run: npm run test:format

      - name: Run TypeScript GLTF import tests
        working-directory: reference/typescript
        run: npm run test:gltf

      - name: Run TypeScript example tests
        working-directory: reference/typescript
        run: npm run test:examples
